<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İki Kişilik Kart Oyunu</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            margin: 0;
            height: 100vh;
            background-color: #f4f4f9;
        }
        .panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-panel {
            background-color: #ffffff;
            border-left: 2px solid #ccc;
            border-right: 2px solid #ccc;
        }
        .center-panel {
            flex: 0.8;
            justify-content: center;
            background-color: #e9ecef;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        #draw-btn {
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        #draw-btn:hover {
            background-color: #0056b3;
        }
        .turn-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #d9534f;
        }
        .inventory {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 250px;
            margin-top: 15px;
        }
        .card {
            border: 2px solid #555;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            background-color: #fff3cd;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .delete-btn {
            padding: 8px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <!-- Sol Kısım: Player 1 -->
    <div class="panel player-panel">
        <h2>Player 1</h2>
        <p>Kart Sayısı: <span id="p1-count">0</span> / 7</p>
        <div id="p1-inventory" class="inventory"></div>
    </div>

    <!-- Orta Kısım: Zar ve Sıra -->
    <div class="panel center-panel">
        <div id="turn-display" class="turn-text">Sıra: Player 1</div>
        <button id="draw-btn" onclick="drawCard()">Kart Çek</button>
    </div>

    <!-- Sağ Kısım: Player 2 -->
    <div class="panel player-panel">
        <h2>Player 2</h2>
        <p>Kart Sayısı: <span id="p2-count">0</span> / 7</p>
        <div id="p2-inventory" class="inventory"></div>
    </div>

    <script>
        // Oyun Ayarları ve Değişkenler
        const cardTypes = ["Kötülük", "Güç", "Bilgelik", "Element"];
        const maxCards = 7;
        
        let p1Cards = [];
        let p2Cards = [];
        let currentTurn = 1;

        // Kart Çekme Fonksiyonu
        function drawCard() {
            let activeCards = currentTurn === 1 ? p1Cards : p2Cards;

            // Envanter doluluk kontrolü
            if (activeCards.length >= maxCards) {
                alert(`Player ${currentTurn} envanteri dolu! Lütfen kart çekmeden önce bir kart silin.`);
                return; 
            }

            // Rastgele kart seçimi
            let randomCard = cardTypes[Math.floor(Math.random() * cardTypes.length)];
            activeCards.push(randomCard);

            // Sırayı değiştir
            currentTurn = currentTurn === 1 ? 2 : 1;

            // Ekranı güncelle
            updateUI();
        }

        // Kart Silme Fonksiyonu
        function deleteCard(playerNum, index) {
            if (playerNum === 1) {
                p1Cards.splice(index, 1);
            } else {
                p2Cards.splice(index, 1);
            }
            updateUI();
        }

        // Ekranı Yenileme Fonksiyonu
        function updateUI() {
            // Sıra metnini güncelle
            let turnText = document.getElementById("turn-display");
            turnText.innerText = `Sıra: Player ${currentTurn}`;
            turnText.style.color = currentTurn === 1 ? "#d9534f" : "#0275d8";

            // Player 1 Güncelleme
            document.getElementById("p1-count").innerText = p1Cards.length;
            let p1Html = "";
            p1Cards.forEach((card, index) => {
                p1Html += `
                    <div class="card">
                        ${card}
                        <button class="delete-btn" onclick="deleteCard(1, ${index})">Sil</button>
                    </div>`;
            });
            document.getElementById("p1-inventory").innerHTML = p1Html;

            // Player 2 Güncelleme
            document.getElementById("p2-count").innerText = p2Cards.length;
            let p2Html = "";
            p2Cards.forEach((card, index) => {
                p2Html += `
                    <div class="card">
                        ${card}
                        <button class="delete-btn" onclick="deleteCard(2, ${index})">Sil</button>
                    </div>`;
            });
            document.getElementById("p2-inventory").innerHTML = p2Html;
        }

        // Başlangıçta ekranı bir kere oluştur
        updateUI();
    </script>
</body>
</html>
